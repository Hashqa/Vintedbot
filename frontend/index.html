<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jolly Wilds</title>
<link rel="icon" href="data:,">
<style>
/* polices embarquées (licence SIL OFL) : aucune ressource externe */
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(theme/fonts/lilita-one-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(theme/fonts/lilita-one-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(theme/fonts/outfit-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(theme/fonts/outfit-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{--bg:#06122b;--bg2:#0b2350;--panel:rgba(8,22,52,.82);--line:rgba(255,214,120,.28);--gold:#ffc83d;--gold2:#ff9f1c;--ink:#fff6e0;--mute:#b9c3dd;--sea:#0e4f8a;
  --display:'Lilita One',system-ui,sans-serif;--body:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 80% at 50% 0%,#1d4f8f 0%,rgba(6,18,43,0) 60%),radial-gradient(90% 60% at 50% 110%,#0b3d6b 0%,rgba(6,18,43,0) 70%),linear-gradient(180deg,#0a2148,#06122b)}
body.fs{background-image:radial-gradient(120% 80% at 50% 0%,#5b2a8f 0%,rgba(6,18,43,0) 60%),radial-gradient(90% 60% at 50% 110%,#2b0b5b 0%,rgba(6,18,43,0) 70%),linear-gradient(180deg,#1a0d3d,#0a0620)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}

/* ===== mise en page Stake Engine : tout tient dans la fenêtre, aucun défilement =====
   Disposition reprise de l'interface de référence Stake (web-sdk) :
   barre de commandes sous la grille — menu et achat du bonus à gauche, Auto / SPIN / Turbo au centre, − / + à droite —
   avec le solde, le gain et la mise au-dessus. En portrait : gain, puis menu · auto · SPIN · turbo · bonus, puis solde, puis − mise +. */
.app{--gap:clamp(4px,1.1vmin,12px);--topH:clamp(22px,6vh,46px);--crH:clamp(16px,5.5vh,44px);--msgH:clamp(14px,4vh,30px);
  --labH:clamp(18px,5vh,40px);--spinS:clamp(34px,11vh,84px);--btnS:clamp(26px,6.5vh,48px);
  --hudH:calc(var(--labH) + var(--spinS) + var(--gap));
  height:100%;padding:var(--gap) calc(var(--gap)*1.5);gap:var(--gap);
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--topH) minmax(0,1fr) var(--hudH);grid-template-areas:"top" "machine" "hud"}
header.top{grid-area:top;display:flex;align-items:center;gap:var(--gap);min-width:0}
.logo{font-family:var(--display);font-size:clamp(14px,min(4.6vh,4vw),34px);white-space:nowrap;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff2a8,#ffc83d 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a2a00)}
.logo span{background:linear-gradient(180deg,#9be7ff,#3a86ff);-webkit-background-clip:text;background-clip:text}
.sess{margin-left:auto;font-size:clamp(8px,1.6vh,12px);color:var(--mute);white-space:nowrap}

.machine{grid-area:machine;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;position:relative}
.crewbar{height:var(--crH);display:flex;align-items:center;justify-content:center;gap:clamp(2px,.8vmin,8px);width:100%}
.crewbar .cm{position:relative;height:100%;aspect-ratio:1;opacity:.35;filter:grayscale(.7);transition:all .25s}
.crewbar .cm svg{width:100%;height:100%}
.crewbar .cm.on{opacity:1;filter:none;transform:scale(1.18)}
.crewbar .cm.off{opacity:.12}
.crewbar .cm b{position:absolute;right:-4px;bottom:-2px;font-family:var(--display);font-weight:400;font-size:clamp(7px,1.6vh,12px);background:#16161f;border-radius:6px;padding:0 3px;border:1px solid var(--line)}
body:not(.fs) .crewbar .cm{opacity:.55;filter:none}
.toprow{height:var(--crH);width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,24px);position:relative}
.toprow .crewbar{width:auto}
/* jauge du pavillon (jeu de base) */
.flagmeter{height:100%;display:flex;align-items:center;gap:clamp(3px,.8vmin,8px);padding:2px clamp(6px,1.2vmin,12px);border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.flagmeter .ml{font-size:clamp(7px,1.5vh,11px);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.flagmeter .mh{font-size:clamp(7px,1.5vh,11px);color:var(--gold);white-space:nowrap}
.flagmeter .slot{height:88%;aspect-ratio:1;border-radius:8px;border:1px dashed rgba(255,214,120,.5);display:grid;place-items:center;opacity:.35;filter:grayscale(1)}
.flagmeter .slot svg{width:90%;height:90%}
.flagmeter .slot.on{opacity:1;filter:none;border-style:solid;background:rgba(255,200,61,.18)}
.flagmeter.full{animation:champ .45s ease-out;box-shadow:0 0 18px 4px rgba(255,200,61,.7)}
.flagleft{height:100%;display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:999px;background:var(--gold);color:#2a1600;font-size:clamp(9px,1.8vh,13px);font-weight:800;white-space:nowrap}
.flagleft b{font-family:var(--display);font-weight:400;font-size:clamp(12px,2.6vh,20px)}
body.fs .flagmeter,body.fs .flagleft{display:none!important}
.flyflag{position:fixed;z-index:50;pointer-events:none;transition:all .38s cubic-bezier(.4,.1,.3,1)}
.flyflag svg{width:100%;height:100%}
.cell.taken svg{opacity:.25}
@media (max-aspect-ratio: 9/10){ .flagmeter .mh{display:none} }
.board-wrap{position:relative;max-width:100%;width:min(calc((100vh - var(--topH) - var(--hudH) - var(--crH) - var(--msgH) - var(--gap)*6 - 10px) * 1.25), calc(100vw - var(--gap)*4), 900px);
  padding:clamp(3px,.9vmin,10px);border-radius:clamp(10px,2.4vmin,26px);background:linear-gradient(180deg,#a8692f,#5c2f10);box-shadow:0 0 0 2px #2b1405,0 10px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25)}
.board{--bp:clamp(2px,.5vmin,5px);position:relative;aspect-ratio:5/4;max-width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--bp);border-radius:clamp(7px,1.7vmin,18px);overflow:hidden;
  background:linear-gradient(180deg,#123a6e,#0a2148);padding:var(--bp)}
/* calque des wilds collants : mêmes colonnes que les rouleaux, il ne bouge pas quand les rouleaux tournent */
.stickies{position:absolute;inset:0;padding:var(--bp);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);column-gap:var(--bp);pointer-events:none;z-index:3}
.cell.sticky{padding:6%}
.cell.sticky::after{content:'';position:absolute;inset:4%;border-radius:50%;box-shadow:0 0 14px 2px rgba(255,214,120,.35);pointer-events:none}
body.fs .board{background:linear-gradient(180deg,#2e1460,#120a33)}
.reel{position:relative;overflow:hidden;border-radius:clamp(4px,1vmin,10px);background:rgba(255,255,255,.04)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{position:relative;display:grid;place-items:center;padding:6%}
.cell svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.cell.win svg{animation:pulse .7s ease-in-out infinite alternate}
.cell.win::before{content:'';position:absolute;inset:3%;border-radius:12%;background:radial-gradient(circle,rgba(255,214,120,.45),rgba(255,214,120,0) 70%);border:2px solid rgba(255,214,120,.8)}
.board.showing .cell:not(.win):not(.sc){opacity:.35;filter:grayscale(.6)}
.cell.sc svg{animation:pulse .5s ease-in-out infinite alternate}
.cell .mult{position:absolute;right:4%;bottom:4%;font-family:var(--display);font-size:clamp(9px,3.2vmin,26px);line-height:1;color:#fff;background:#16161f;border-radius:999px;padding:.1em .35em;border:2px solid var(--cc,#ffc83d)}
.cell.crew{animation:drop .45s cubic-bezier(.2,1.4,.5,1) both}
/* duel, coffre, respin du pavillon */
.cell.sticky.duel{animation:duelshake .18s linear infinite}
.cell.sticky.duel::after{box-shadow:0 0 22px 6px rgba(255,214,10,.8)}
@keyframes duelshake{25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
.cell.sticky.champ{animation:champ .7s ease-out}
@keyframes champ{30%{transform:scale(1.22)}}
.cell.sticky.flip{animation:flip .55s ease-in-out}
@keyframes flip{50%{transform:rotateY(90deg) scale(.9)}}
.cell.sticky.boost{animation:champ .6s ease-out}
.cell.sticky .plus{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(14px,4vmin,30px);color:var(--gold);text-shadow:0 2px 0 #5a2a00;animation:plusup 1.2s ease-out forwards;pointer-events:none}
@keyframes plusup{to{transform:translate(-50%,-90%);opacity:0}}
.cell.open svg{animation:open .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ffd60a)}
@keyframes open{to{transform:scale(1.18) rotate(-4deg)}}
.cell.sticky.flag::after{border-radius:14%;box-shadow:0 0 16px 3px rgba(255,200,61,.55)}
@keyframes drop{from{transform:translateY(-120%) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
/* ===== animations des symboles (classes a-… posées dans frontend/art.js) ===== */
svg [class^="a-"],svg [class*=" a-"]{transform-box:fill-box}
/* au repos */
.a-spark,.a-glow,.a-flash,.a-smoke,.a-drip,.a-eyes{opacity:0}
.a-cloth{transform-origin:0% 50%;animation:cloth 2.4s ease-in-out infinite}
@keyframes cloth{50%{transform:skewY(-4deg) scaleX(.96)}}
.a-blink{transform-origin:50% 0%;transform:scaleY(0);animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.a-bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(1.6px)}}
.a-wing{transform-origin:0% 0%;animation:wing 2.2s ease-in-out infinite}
@keyframes wing{50%{transform:rotate(-6deg)}}
.a-rays{transform-origin:50% 50%;animation:rays 18s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.a-shine{animation:shine 3.4s ease-in-out infinite}
@keyframes shine{50%{opacity:.25}}
.a-needle{transform-origin:50% 50%;animation:needle 3s ease-in-out infinite}
@keyframes needle{25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
.a-liquid{animation:slosh 3s ease-in-out infinite}
@keyframes slosh{50%{transform:translateX(-6px)}}
/* sur un gain */
.cell.win .a-spark{transform-origin:50% 50%;animation:spark 1.1s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.cell.win .a-lid{transform-origin:50% 100%;animation:lid .9s ease-in-out infinite alternate}
@keyframes lid{to{transform:translateY(-7px) rotate(-7deg)}}
.cell.win .a-glow{animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{to{opacity:1}}
.cell.win .a-coins{animation:coins .45s ease-in-out infinite alternate}
@keyframes coins{to{transform:translateY(-4px)}}
.cell.win .a-tilt{transform-origin:50% 100%;animation:tilt .7s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.cell.win .a-liquid{animation:slosh .35s ease-in-out infinite alternate}
.cell.win .a-path{animation:path .8s linear infinite}
@keyframes path{to{stroke-dashoffset:-16}}
.cell.win .a-x{transform-origin:50% 50%;animation:xpulse .5s ease-in-out infinite alternate}
@keyframes xpulse{to{transform:scale(1.3) rotate(8deg)}}
.cell.win .a-needle{animation:spinfull 1s cubic-bezier(.4,.1,.3,1) infinite}
@keyframes spinfull{to{transform:rotate(360deg)}}
.cell.win .a-eyes{animation:glow .4s ease-in-out infinite alternate}
.cell.win .a-swl{transform-origin:50% 50%;animation:clashl .5s ease-in-out infinite alternate}
.cell.win .a-swr{transform-origin:50% 50%;animation:clashr .5s ease-in-out infinite alternate}
@keyframes clashl{to{transform:rotate(-9deg)}}
@keyframes clashr{to{transform:rotate(9deg)}}
.cell.win .a-swing{transform-origin:50% 0%;animation:swing .8s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.cell.win .a-recoil{animation:recoil 1s ease-out infinite}
@keyframes recoil{0%,100%{transform:none}8%{transform:translate(-5px,2px)}}
.cell.win .a-flash{transform-origin:50% 50%;animation:flash 1s ease-out infinite}
@keyframes flash{0%{opacity:1;transform:scale(.4)}18%{opacity:1;transform:scale(1.4)}35%,100%{opacity:0}}
.cell.win .a-smoke{animation:smoke 1s ease-out infinite}
@keyframes smoke{0%,10%{opacity:0;transform:none}30%{opacity:.9}100%{opacity:0;transform:translate(6px,-10px) scale(1.6)}}
.cell.win .a-tube{animation:tube .7s ease-in-out infinite alternate}
@keyframes tube{to{transform:translateX(6px)}}
.cell.win .a-glint{animation:glow .35s ease-in-out infinite alternate}
.cell.win .a-wobble{transform-origin:50% 100%;animation:tilt .45s ease-in-out infinite alternate}
.cell.win .a-drip{animation:drip .9s ease-in infinite}
@keyframes drip{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(9px)}}
.cell.win .a-spin,.cell.sc .a-spin{transform-origin:50% 50%;animation:coin 1.1s ease-in-out infinite}
@keyframes coin{50%{transform:scaleX(-1)}}
.cell.win .a-cloth{animation-duration:.8s}
.cell.win .a-bob{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){ svg [class^="a-"],svg [class*=" a-"]{animation:none!important} .a-blink{transform:scaleY(0)} }

.msgline{height:var(--msgH);width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.msgline .msg{font-size:clamp(9px,2vh,15px);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fsinfo{position:absolute;inset:0;display:flex;justify-content:center;gap:clamp(8px,3vw,40px);align-items:center;border-radius:999px;background:rgba(30,10,60,.92);border:1px solid rgba(199,125,255,.5);margin:0 auto;max-width:520px}
.fsinfo .lab{font-size:clamp(7px,1.5vh,11px);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.fsinfo .val{font-family:var(--display);font-size:clamp(10px,2.6vh,22px)}
body.fs .msgline .msg{visibility:hidden}
.callout{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;display:flex;align-items:center;gap:clamp(6px,2vmin,18px);
  background:rgba(8,6,24,.9);border:2px solid var(--cc,#ffc83d);border-radius:clamp(12px,3vmin,24px);padding:clamp(6px,2vmin,16px) clamp(10px,3vmin,26px);animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
.callout svg{width:clamp(36px,14vmin,110px);height:auto}
.callout .n{font-family:var(--display);font-size:clamp(14px,4.4vmin,36px);line-height:1}
.callout .x{font-family:var(--display);font-size:clamp(18px,7vmin,56px);color:var(--cc,#ffc83d);line-height:1}
.callout small{display:block;color:var(--mute);font-size:clamp(9px,2vmin,14px)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}

/* ===== barre de commandes ===== */
.hud{grid-area:hud;position:relative;width:min(100%,1100px);margin:0 auto;min-height:0;display:grid;align-items:center;column-gap:clamp(4px,1.2vw,14px);row-gap:var(--gap);
  grid-template-columns:auto auto minmax(0,1fr) auto auto auto minmax(0,1fr) auto auto;grid-template-rows:var(--labH) var(--spinS);
  grid-template-areas:"bal bal . win win win . bet bet" "menu buy . aut spin turbo . dec inc"}
.lab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.05}
.lab small{font-size:clamp(7px,1.5vh,11px);color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.lab strong{font-size:clamp(11px,2.6vh,19px);white-space:nowrap;font-variant-numeric:tabular-nums}
#lBal{grid-area:bal;align-items:flex-start}#lWin{grid-area:win}#lBet{grid-area:bet;align-items:flex-end}
#lWin strong{font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(13px,3.2vh,26px)}
.hbtn{width:var(--btnS);height:var(--btnS);border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;font-weight:800;font-size:clamp(11px,2.4vh,17px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.hbtn svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hbtn:disabled{opacity:.35}
.hbtn[aria-pressed="true"]{background:var(--gold);color:#2a1600;border-color:var(--gold)}
.hbtn.auto-on{background:var(--gold);color:#2a1600}
#menuBtn{grid-area:menu}#autoBtn{grid-area:aut;justify-self:end}#turboBtn{grid-area:turbo;justify-self:start}#betDown{grid-area:dec}#betUp{grid-area:inc}
.buybtn{grid-area:buy;height:var(--btnS);border-radius:999px;border:2px solid #fff2a8;padding:0 clamp(10px,1.6vw,18px);font-family:var(--display);font-size:clamp(11px,2.5vh,18px);letter-spacing:.04em;
  background:linear-gradient(180deg,#b15cff,#6a1fb8);color:#fff;box-shadow:0 3px 0 #3a0d6b;white-space:nowrap}
.buybtn:disabled{opacity:.4}
.buybtn.short{filter:saturate(.35) brightness(.8)}
.spin{grid-area:spin;position:relative;width:var(--spinS);height:var(--spinS);border-radius:50%;border:3px solid #fff2a8;background:radial-gradient(circle at 40% 35%,#fff2a8,#ffc83d 45%,#c46a00);box-shadow:0 5px 0 #7a3d00,0 8px 20px rgba(0,0,0,.4);display:grid;place-items:center;padding:0;color:#3b1a06}
.spin svg{width:45%;height:45%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.spin:disabled{filter:saturate(.3) brightness(.7)}
.spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #7a3d00}
.spin .cnt{position:absolute;font-family:var(--display);font-size:clamp(14px,4vh,28px)}
.spin.auto svg{opacity:.15}
/* menu : règles, son, musique (pile verticale au-dessus du bouton, comme dans l'interface Stake) */
.menu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:30;display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap);background:var(--panel);border:1px solid var(--line);border-radius:999px}
.menu .hbtn[aria-pressed="false"]{opacity:.5}
/* portrait (mobile) */
@media (max-aspect-ratio: 9/10){
  .app{--topH:clamp(22px,4.5vh,40px);--crH:clamp(26px,6vh,52px);--msgH:clamp(26px,6vh,46px);--labH:clamp(22px,5vh,40px);--spinS:clamp(56px,10vh,88px);--btnS:clamp(34px,6vh,50px);
    --hudH:calc(var(--labH) * 2 + var(--spinS) + var(--btnS) + var(--gap) * 3)}
  .hud{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:var(--labH) var(--spinS) var(--labH) var(--btnS);justify-items:center;
    grid-template-areas:"win win win win win" "menu aut spin turbo buy" "bal bal bal bal bal" "dec bet bet bet inc"}
  #lBal,#lBet{align-items:center}#autoBtn,#turboBtn{justify-self:center}
  .buybtn{padding:0 8px;font-size:clamp(11px,3.2vw,15px)}
  .board{aspect-ratio:5/5.6}
  .board-wrap{width:min(calc(100vw - var(--gap)*3), calc((100vh - var(--topH) - var(--hudH) - var(--crH) - var(--msgH) - var(--gap)*7 - 10px) * 5 / 5.6))}
  .msgline .msg{white-space:normal;text-align:center;line-height:1.2}
}
/* très petite hauteur (Popout S 400×225) : on retire le superflu */
@media (max-height:300px){
  header.top,.toprow,.msgline .msg,.lab small{display:none!important}
  .app{--topH:0px;--crH:0px;--msgH:0px;grid-template-rows:0 minmax(0,1fr) var(--hudH);row-gap:3px}
  body.fs .msgline{height:16px}
}
/* replay : ni mise ni achat ; on garde le gain et la mise rejouée */
body.replay .hud > button,body.replay #lBal{display:none!important}
body.replay .app{--msgH:clamp(22px,7vh,40px);--hudH:var(--labH)}
body.replay .hud{grid-template-rows:var(--labH);grid-template-areas:"bal bal . win win win . bet bet"}
body.replay .board{aspect-ratio:5/4}
body.replay .board-wrap{width:min(calc((100vh - var(--topH) - var(--hudH) - var(--crH) - var(--msgH) - var(--gap)*6 - 10px) * 1.25), calc(100vw - var(--gap)*4))}
.machine:has(.rp-end) .msgline{visibility:hidden}
.rp-banner{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:12;white-space:nowrap;font-weight:800;font-size:clamp(9px,1.9vh,14px);letter-spacing:.04em;background:rgba(8,6,24,.92);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.rp-play{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,3,18,.55)}
.rp-play button{font-family:var(--display);font-size:clamp(18px,5vmin,36px);border:0;border-radius:999px;padding:.45em 1.4em;background:linear-gradient(180deg,#7dffb3,#14b866);color:#06331b;box-shadow:0 6px 0 #064d28}
.rp-end{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:40;height:var(--msgH);max-width:100%;display:flex;gap:clamp(4px,1vw,10px);align-items:center;background:rgba(8,6,24,.94);border:1px solid var(--gold);border-radius:999px;padding:0 3px 0 clamp(8px,1.6vw,16px);font-weight:800;font-size:clamp(9px,2.2vh,16px);white-space:nowrap}
.rp-end span{overflow:hidden;text-overflow:ellipsis}
.rp-end button{flex:0 0 auto;height:calc(var(--msgH) - 6px);border:0;border-radius:999px;padding:0 clamp(8px,1.4vw,14px);font-weight:800;font-size:inherit;background:var(--gold);color:#2a1600}
/* choix du bonus */
.buychoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.buychoice button{border:2px solid var(--line);border-radius:16px;padding:12px 8px;background:linear-gradient(180deg,rgba(255,200,61,.18),rgba(8,22,52,.9));text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.buychoice button.sup{background:linear-gradient(180deg,rgba(177,92,255,.3),rgba(8,22,52,.9));border-color:rgba(199,125,255,.5)}
.buychoice .k{font-family:var(--display);font-size:clamp(16px,3.4vmin,24px)}
.buychoice .d{font-size:clamp(11px,2vmin,13px);color:var(--mute)}
.buychoice .p{font-weight:800;background:var(--gold);color:#2a1600;border-radius:999px;padding:2px 12px}
.buychoice .crewmini{display:flex;gap:3px}.buychoice .crewmini svg{width:clamp(18px,4vmin,28px);height:auto}
.buychoice button.short{filter:saturate(.35) brightness(.8)}
@media (max-width:420px){ .buychoice{grid-template-columns:1fr} }
.autochoice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.autochoice button{min-width:56px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:800;background:rgba(255,255,255,.08)}
.autochoice button[aria-pressed="true"]{background:var(--gold);color:#2a1600}

/* fenêtres */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(3,8,20,.72);padding:8px}
.card{background:linear-gradient(180deg,#123063,#0a1a3d);border:2px solid var(--line);border-radius:18px;padding:clamp(10px,3vmin,26px);max-width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:text;-webkit-user-select:text}
.card.wide{max-width:min(860px,100%);text-align:left}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vmin,40px);margin:0 0 8px;color:var(--gold)}
.card h3{font-family:var(--display);font-weight:400;font-size:clamp(15px,3vmin,22px);margin:16px 0 6px;color:var(--gold)}
.card p,.card li{font-size:clamp(12px,2.3vmin,15px);line-height:1.45;color:#e8ecf8}
.card .fine{color:var(--mute);font-size:13px}
.card .kicker{text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-size:12px}
.card .row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 22px;font-weight:800;font-size:clamp(13px,2.4vmin,16px)}
.btn.go{background:linear-gradient(180deg,#fff2a8,#ffc83d);color:#2a1600;box-shadow:0 4px 0 #8a5300}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.crewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.crewgrid div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px 6px;font-size:clamp(10px,2vmin,13px);text-align:left}
.crewgrid div.off{opacity:.3}
.crewgrid svg{width:clamp(28px,7vmin,48px);height:auto;flex:0 0 auto}
.crewgrid b{font-family:var(--display);font-weight:400;font-size:clamp(13px,2.8vmin,20px);color:var(--gold);display:block}
.tablewrap{overflow-x:auto}
table.pay{border-collapse:collapse;width:100%;font-size:clamp(11px,2.1vmin,14px)}
table.pay th,table.pay td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;white-space:nowrap}
table.pay td:first-child,table.pay th:first-child{text-align:left}
table.pay svg{width:26px;height:26px;vertical-align:middle}
.ctrl-list{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:6px 0;font-size:clamp(12px,2.2vmin,14px)}
.ctrl-list b{white-space:nowrap}
.bigwin{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(40,20,0,.75),rgba(3,8,20,.92))}
.bigwin .tier{font-family:var(--display);font-size:clamp(28px,10vmin,90px);background:linear-gradient(180deg,#fff2a8,#ffc83d 50%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a00)}
.bigwin .tier.up{animation:pop2 .4s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop2{from{transform:scale(.4)}}
.bigwin .amt{font-family:var(--display);font-size:clamp(22px,7vmin,64px)}
.bigwin .sub{color:#fff;font-size:clamp(11px,2.4vmin,17px);margin-top:6px;opacity:.9}
.bigwin .hint{color:var(--mute);font-size:clamp(10px,2vmin,14px);margin-top:10px}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:80;background:rgba(8,6,24,.94);border:2px solid var(--gold);border-radius:999px;padding:8px 20px;font-family:var(--display);font-size:clamp(14px,3.4vmin,26px);animation:pop3 .3s}
@keyframes pop3{from{opacity:0;transform:translate(-50%,-20px)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:75}
.boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,8,20,.9);text-align:center;padding:16px;font-size:clamp(12px,2.6vmin,18px)}
.boot h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,4.5vmin,34px);margin:0 0 8px}
.boot .spinner{width:clamp(28px,7vmin,48px);height:clamp(28px,7vmin,48px);border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:orb 1s linear infinite;margin:0 auto 12px}
@keyframes orb{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .cell.win svg,.cell.sc svg{animation:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo" aria-label="Jolly Wilds">JOLLY <span>WILDS</span></div>
    <span class="sess" id="sess" hidden></span>
  </header>

  <main class="machine">
    <div class="rp-banner" id="rpBanner" hidden></div>
    <div class="toprow"><div class="crewbar" id="crewbar"></div><div class="flagmeter" id="flagMeter"></div><div class="flagleft" id="flagLeft" hidden></div></div>
    <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
    <div class="msgline"><span class="msg" id="msg"></span>
      <div class="fsinfo" id="fsInfo" hidden><span><span class="lab" id="tFsLeft">Free spins</span><span class="val" id="fsLeft">0</span></span><span><span class="lab" id="tFsWin">Bonus win</span><span class="val" id="fsWin">0</span></span></div>
    </div>
  </main>

  <section class="hud" id="hud">
    <div class="lab" id="lBal"><small id="tBalance">Balance</small><strong id="balance">—</strong></div>
    <div class="lab" id="lWin"><small id="tWin">Win</small><strong id="winAmt">—</strong></div>
    <div class="lab" id="lBet"><small id="tBet">Bet</small><strong id="betVal">—</strong></div>
    <button class="hbtn" id="menuBtn" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="menu" id="menu" hidden>
      <button class="hbtn" id="rulesBtn">?</button>
      <button class="hbtn" id="musicBtn" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
      <button class="hbtn" id="muteBtn"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
    </div>
    <button class="buybtn" id="buyBtn">BONUS</button>
    <button class="hbtn" id="autoBtn"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
    <button class="spin" id="spinBtn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span class="cnt" id="autoCnt" hidden></span></button>
    <button class="hbtn" id="turboBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="hbtn" id="betDown">−</button>
    <button class="hbtn" id="betUp">+</button>
  </section>
</div>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
